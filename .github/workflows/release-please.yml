# On each merge to main, release-please keeps a release pull request open.
# It bumps package.json and writes CHANGELOG.md from the merged pull
# request titles. Merging it tags the version, makes a GitHub release, and
# publish.yml publishes the new version to the Marketplace.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Events made with GITHUB_TOKEN start no workflows, so the release pull
  # request gets no checks of its own. Test its head here and post the
  # result on it as the `test` status.
  test-release-pr:
    needs: release-please
    if: needs.release-please.outputs.pr
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          submodules: true
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: test
        run: pnpm test
      - name: Post the result on the release pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.test.outcome }}
        run: |
          if [ "$OUTCOME" = success ]; then state=success; else state=failure; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$(git rev-parse HEAD)" \
            -f state="$state" -f context=test \
            -f description="pnpm test on the release branch: $OUTCOME" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
