# yaml-language-server: $schema=https://raw.githubusercontent.com/tupe12334/linecheck/main/schema/linecheck.schema.json
# Per-file line limits. Base: the linecheck --default preset (warn 200, error 400).

rules:
  # Already 431 lines. Room to grow while tests get split by grammar area.
  - pattern: "scripts/test-grammar.js"
    warn: 400
    warn_message: "Split the grammar tests into one file per grammar area"
    error: 600
  - pattern: "**/*.js"
    warn: 200
    warn_message: "Getting long. Consider splitting this module"
    error: 400
    error_message: "Too large to review easily. Split this file before merging"
  # Every other file uses the built-in fallback: warn 200, error 400.

exclude:
  - "pnpm-lock.yaml"
  - "CHANGELOG.md" # generated by release-please
  - "assets/**" # git submodule (rein-lang/assets)
